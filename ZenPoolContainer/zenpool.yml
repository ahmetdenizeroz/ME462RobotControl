    - cd /home/ros/ws_me462 ; source install/local_setup.bash ; clear ; ros2 launch my_robot_cell_moveit_config move_group.launch.py
    - cd /home/ros/ws_me462 ; source install/local_setup.bash ; clear ; ros2 run zenpool_draw_letter custom_dashboard.py
    - cd /home/ros/ws_me462 ; source install/local_setup.bash ; clear ; sleep 10 ; ros2 run zenpool_draw_letter tool_manager.py
