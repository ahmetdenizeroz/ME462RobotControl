    layout: "f651,248x60,0,0{124x60,0,0[124x30,0,0,0,124x29,0,31,2],123x60,125,0,1}"
    panes:
    - cd /home/ros/ws_me462 ; source install/local_setup.bash ; clear
    - cd /home/ros/ws_me462 ; source install/local_setup.bash ; clear
    - cd /home/ros/ws_me462 ; source install/local_setup.bash ; clear ; python3 src/ME462RobotControl/zenpool_draw_letter/scripts/command_search_tui.py
- background_nodes:
